<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

<div class="container">
    <div class="row ">

    </div>
</div>

<script>
    let arrData=[
        {title:"shirt", price:500},
        {title:"pant", price:1000},
        {title:"shoes", price:1500},
        {title:"watch", price:2000},
        {  title:"belt", price:2500},
    ]

    arrData.forEach(function(el){
        let divTag=document.createElement('div');
        let h2Tag = document.createElement('h2');
        h4Tag = document.createElement('h4');
        let buttonTag = document.createElement('button');

        h2Tag.innerText=el.title;
        h4Tag.innerText=el.price;
        buttonTag.innerText="add to cart";

        buttonTag.addEventListener('click', addtoCart);
        divTag.addEventListener('click',modalBox);
        divTag.className = "col-md-3 text-center p-3 border";

        divTag.append(h2Tag,h4Tag,buttonTag);
        document.querySelector('.row').append(divTag);
      })

        function addtoCart(e){
            // e.stopPropagation();
            e.cancleBubble=true;
            alert("item added to cart");
        }
        function modalBox(){
            alert("item added to cart modalbox");
        }
</script>
